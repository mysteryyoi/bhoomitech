name: CI

on:
  pull_request:
  push:
    branches: [main, 'phase-*']

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci
      - run: npm run check
      - run: npm run test:unit

      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

      # Production-mode rebuild so Lighthouse never sees e2e keys.
      - run: npm run build

      # lhci autodetects the runner's preinstalled Google Chrome.
      - run: npm run lhci

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-reports
          path: |
            .lighthouseci/
            playwright-report/
          if-no-files-found: ignore
